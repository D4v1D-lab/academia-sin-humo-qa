name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Chequeo de tipos
        run: npx tsc --noEmit

      - name: Ejecutar suite del proyecto final
        # La suite completa (e2e + api + integrado + a11y). Los tests que
        # documentan bugs (z-bugs-api.spec.ts, z-sesion-bug03.spec.ts y
        # req-c06.spec.ts) usan test.fail(): la aserción de la spec se
        # ejecuta y se espera que falle; si el producto corrige el bug, el
        # test pasa y el run se pone rojo con "unexpectedly passed".
        # No se usa skip ni `|| true`.
        run: npx playwright test --project=chromium

      - name: Subir reporte HTML
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14
