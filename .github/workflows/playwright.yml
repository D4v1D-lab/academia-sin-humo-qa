name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar suite del proyecto final
        # La suite completa (e2e + api + integrado). Los tests que documentan
        # bugs (z-bugs-api.spec.ts y req-c06.spec.ts) fallan a propósito y son
        # hallazgos reportados en docs/reporte-de-bugs.md: el run queda rojo
        # mientras el producto no cumpla la spec. No se usa skip ni `|| true`.
        run: npx playwright test --project=chromium

      - name: Subir reporte HTML
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14
